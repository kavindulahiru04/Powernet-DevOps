---
- name: Deploy Powernet IT Service Dashboard
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_python_interpreter: /opt/docker-sdk-venv/bin/python

  tasks:
    - name: Ensure the dashboard container is running
      community.docker.docker_container:
        name: powernet-dashboard-container
        image: powernet-dashboard:1.0
        state: started
        recreate: true
        restart_policy: unless-stopped
        published_ports:
          - "3000:3000"
